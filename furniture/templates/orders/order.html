{% extends "base.html" %}
{%block navbar%}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<header class="ordernav">
        <div class= "nav1">
            <a href="{%url 'dashboard'%}" class="section" >
            <span style="font-size: 20px; color: white">
                <i class="fa-solid fa-arrow-left"></i>
            </span>
            </a>
        </div>
        <div class= "nav2">Orders</div>
        <a href="{%url 'order_create'%}" class="section">
        <div class= "nav3">
            <span class="plus">
                <i class="fa-solid fa-plus"></i>
            </span>
        </div>
        </a>
</header>
{%endblock%}
{%block content%}
    <div class = "search_box">
        <input type="text" placeholder="Search Orders...">
    </div>
    <div class = "order_list">
        {% for order in orders%}
        <a href="{%url 'order_detail' order.pk%}" class="section">
        <div class = "order_card">
            <div class = "order_name">
                {{order.customer_name}}<br>
                <p style="font-size:14px">{{order.order_name}}</p>
            </div>
        </div>
         </a><br>
        {%empty%}
        No orders found
        {%endfor%}
    </div>
{%endblock%}
