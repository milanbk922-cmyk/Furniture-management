{%extends "base.html"%}

{%block navbar%}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<header class="attendance_nav">
        <div class= "nav1">
            <a href="{%url 'monthly_salary_list'%}" class="section" >
            <span style="font-size: 20px; color: white">
                <i class="fa-solid fa-arrow-left"></i>
            </span>
            </a>
        </div>
        <div class= "nav2_attendance">Salary Detail</div> 
</header>
{%endblock%}

{%block content%}
<div class="emp-data">
    <div class="profile-image"></div>
    <div class="profile-info">
        <h3>{{employee.name}}  </h3>
        <p>{{employee.phone}}</p>
    </div>
</div>
<div class="month-picker-container">
    <button type="button" class="month-picker-btn" id="openMonthPicker">
        <span>📅</span>
        <span id="selectedMonth">
            {{selected_date|date:"F Y"}}
        </span>
        <span class="month-arrow">›</span>
    </button>
    {% comment %} Popup {% endcomment %}
    <div class="month-picker-popup" id="monthPickerPopup">
        <div class="picker-header">
            <button type="button" id="prevYear">❮</button>
            <h3 id="pickerYear">2026</h3>
            <button type="button" id="nextYear">❯</button>
        </div>
        <div class="months-grid">
            {% for m in "123456789012"|make_list %}
            <button
                type="button"
                class="month-option"
                data-month="{{forloop.counter }}">
                {% cycle "Jan" "Feb" "Mar" "Apr" "May" "Jun" "Jul" "Aug" "Sep" "Oct" "Nov" "Dec" %}
            </button>
            {%endfor%}
        </div>
    </div>
</div>

{%endblock%}
