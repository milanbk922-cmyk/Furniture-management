{%extends "base.html"%}
{%block navbar%}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<header class="attendance_nav">
        <div class= "nav1">
            <a href="{%url 'dashboard'%}" class="section" >
            <span style="font-size: 20px; color: white">
                <i class="fa-solid fa-arrow-left"></i>
            </span>
            </a>
        </div>
        <div class= "nav2_attendance">Daily Attendance</div> 
</header>
{%endblock%}
{%block content%}
<div class="calendar">

    <div class="header">
        <button onclick="changeMonth(-1)" class="change">❮</button>

        <span id="monthYear"></span>

        <button onclick="changeMonth(1)" class="change">❯</button>
    </div>

    <div class="days" id="calendar"></div>

</div>

{%endblock%}
