{% extends "base.html" %}
{%load static%}
{%block navbar%}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<header class="empnav">
        <div class= "nav1">
            <a href="{%url 'dashboard'%}" class="section" >
            <span style="font-size: 20px;">
                <i class="fa-solid fa-arrow-left"></i>
            </span>
            </a>
        </div>
        <div class= "nav2">Employees</div>
        <a href="{%url 'employee_create'%}" class="section">
        <div class= "nav3">
            <span class="plus">
                <i class="fa-solid fa-plus"></i>
            </span>
        </div>
        </a>
</header>
{%endblock%}
{%block content%}
    <div class = "search_box">
        <input type="text" placeholder="Search Employees...">
    </div>
    <div class = "employee_list">
        {% for employee in employees%}
        <a href="{%url 'employee_detail' employee.pk%}" class="section">
        <div class = "employee_card">
            <div class = "employee_avatar">
                {{ employee.name }}<br>
                {%if employee.status%}
                <span style="color:#0ce70c; font-size:14px;" ;>Active </span>
                {%else%}
                <span style="color:red; font-size:14px" ;>Inactive </span>
                {%endif%}
            </div>
        </div>
        </a><br>
        {%empty%}
        No employees found
        {%endfor%}
    </div>
{%endblock%}
